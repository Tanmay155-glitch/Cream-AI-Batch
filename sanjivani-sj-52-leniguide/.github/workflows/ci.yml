# ============================================================================
# LeniGuide CI – GitHub Actions Workflow
# Student: Tanmay Subhash Gawali (Reg No: 2124UMLM2016, Branch: CSE AI & ML)
# Project: SJ-52 | Product: LeniGuide
#
# Runs ruff linting, pytest suite, and docker build verification
# on every push to main and every PR targeting main.
# ============================================================================

name: LeniGuide CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Pytest suite
        env:
          LLM_PROVIDER: offline
          PYTHONPATH: "."
        run: pytest -v

      - name: Verify Docker image build
        run: docker build -t leniguide-api:ci .
