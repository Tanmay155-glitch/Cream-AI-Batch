# Render Blueprint – LeniGuide FastAPI Deployment
# Student: Tanmay Subhash Gawali (SJ-52)
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: leniguide-sj-52
    runtime: docker
    plan: free
    rootDir: sanjivani-sj-52-leniguide
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
